<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Control - SmartFulfill System</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dispatch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .dispatch-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .dispatch-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            margin: 14px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div id="app-layout">
        <main>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <p style="color:var(--text-secondary); font-size:13px;">Assign shipping carriers and dispatch shipments. This will update inventory totals.</p>
                <span class="badge status-dispatched" id="dispatch-active-count">0 Shipments</span>
            </div>
            
            <div class="dispatch-grid" id="dispatch-tasks-container">
                <!-- Dynamically loaded dispatch items -->
            </div>
            
            <!-- DISPATCH CONFIRMATION MODAL -->
            <div class="modal-overlay" id="dispatch-confirm-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Shipment Routed Successfully</h3>
                        <button class="modal-close" onclick="closeModal('dispatch-confirm-modal')">&times;</button>
                    </div>
                    <div style="text-align: center; padding: 10px 0;">
                        <i class="fas fa-check-circle" style="font-size: 48px; color: var(--success); margin-bottom: 16px;"></i>
                        <h4 id="confirm-order-id" style="font-size: 18px; margin-bottom: 8px;">ORD-0000</h4>
                        <p style="font-size:14px; color:var(--text-secondary);">Package has been loaded for dispatch.</p>
                        
                        <div style="background:rgba(0,0,0,0.3); border:1px dashed var(--border-color); padding:14px; border-radius:var(--radius-sm); margin-top:20px; text-align:left;">
                            <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">Logistics Carrier</div>
                            <strong id="confirm-carrier-text" style="font-size:14px; color:var(--text-primary);">DHL</strong>
                            <div style="font-size:12px; color:var(--text-secondary); margin-top:10px; margin-bottom:4px;">Consignment Air Waybill (AWB)</div>
                            <strong id="confirm-tracking-text" style="font-family:monospace; font-size:15px; color:var(--primary);">TRK000000000</strong>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" onclick="closeModal('dispatch-confirm-modal')" style="width:100%; justify-content:center;">Close</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Global Helpers and Common JS -->
    <script src="js/common.js"></script>
    <!-- Page Specific JS -->
    <script src="js/dispatch.js"></script>
</body>
</html>
