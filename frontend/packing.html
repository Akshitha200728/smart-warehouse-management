<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing Station - SmartFulfill System</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .packing-station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .pack-task-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .pack-items-list {
            margin: 14px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
        
        .pack-item-line {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .pack-item-line:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div id="app-layout">
        <main>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <p style="color:var(--text-secondary); font-size:13px;">Pack picked orders into standard shipping packages.</p>
                <span class="badge status-packed" id="packing-active-count">0 Orders</span>
            </div>
            
            <div class="packing-station-grid" id="packing-tasks-container">
                <!-- Dynamically loaded packing tasks -->
            </div>
            
            <!-- COMPLETE PACKING MODAL -->
            <div class="modal-overlay" id="complete-pack-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Shipment Packaging Parameters</h3>
                        <button class="modal-close" onclick="closeModal('complete-pack-modal')">&times;</button>
                    </div>
                    <form id="complete-pack-form">
                        <input type="hidden" id="pack-order-id">
                        
                        <div class="form-group">
                            <label for="pack-box-type">Container / Box Type</label>
                            <select id="pack-box-type" class="form-control" required>
                                <option value="Standard Cargo Box">Standard Cargo Box (Medium)</option>
                                <option value="Heavy Duty Double-Wall Carton">Heavy Duty Double-Wall Carton (Large)</option>
                                <option value="Bubble Padded Envelope">Bubble Padded Mailer (Small)</option>
                                <option value="Temperature-Controlled Pack">Insulated Temperature Pack (Medical)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="pack-weight">Calculated Package Weight (kg)</label>
                            <input type="number" id="pack-weight" class="form-control" step="0.05" min="0.05" value="1.50" required>
                        </div>
                        
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('complete-pack-modal')">Cancel</button>
                            <button type="submit" class="btn btn-primary">Lock and Finalize Package</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- REPORT PACKING ISSUE MODAL -->
            <div class="modal-overlay" id="pack-issue-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Report Packing Exception</h3>
                        <button class="modal-close" onclick="closeModal('pack-issue-modal')">&times;</button>
                    </div>
                    <form id="pack-issue-form">
                        <input type="hidden" id="pack-issue-order-id">
                        
                        <div class="form-group">
                            <label for="pack-issue-type">Issue Description</label>
                            <select id="pack-issue-type" class="form-control" required>
                                <option value="Packaging Mismatch">Container sizing shortage (No box fits item)</option>
                                <option value="Damaged Item Found">Item damage discovered during wrapping</option>
                                <option value="Label Printing Failure">Barcode scanner/label printer offline</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="pack-issue-desc">Detailed Problem Log</label>
                            <textarea id="pack-issue-desc" class="form-control" rows="3" placeholder="Input details..." required></textarea>
                        </div>
                        
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('pack-issue-modal')">Cancel</button>
                            <button type="submit" class="btn btn-danger">Log Exception</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Global Helpers and Common JS -->
    <script src="js/common.js"></script>
    <!-- Page Specific JS -->
    <script src="js/packing.js"></script>
</body>
</html>
